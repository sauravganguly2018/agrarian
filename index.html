<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/Isolation_Mode.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <title>Agrarian | Sustainable Crop Solutions & Integrated Agriculture</title>
    <meta name="description" content="Agrarian is a leading provider of sustainable agricultural inputs, offering innovative biological and chemical solutions to enhance soil health, plant fertility, and protection. Founded in 2018 in Haryana, India." />
    <meta name="keywords" content="sustainable agriculture, bio insecticides, soil health, plant fertility, biological solutions, crop protection, Haryana agriculture" />
    <meta name="author" content="Agrarian" />
    <style>
      #preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999999;
        transition: opacity 0.5s ease;
      }
      .preloader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .preloader-logo-container {
        position: relative;
        width: 96px;
        height: 96px;
        background: #ffffff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        margin-bottom: 64px;
      }
      .preloader-ring {
        position: absolute;
        inset: -15px;
        border: 4px solid rgba(118, 185, 71, 0.2);
        border-radius: 50%;
        animation: preloader-ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .preloader-logo {
        width: 64px;
        height: 64px;
        animation: preloader-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .preloader-text {
        text-align: center;
        margin-top: 24px;
      }
      .preloader-title {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 24px;
        font-weight: 900;
        color: #1e4a36;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .preloader-status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #9ca3af;
        font-size: 20px;
        font-weight: 500;
      }
      .preloader-dots {
        display: flex;
        gap: 6px;
      }
      .preloader-dot {
        width: 6px;
        height: 6px;
        background-color: #76b947;
        border-radius: 50%;
        animation: preloader-bounce 1.4s infinite ease-in-out both;
      }
      .preloader-dot:nth-child(1) { animation-delay: -0.32s; }
      .preloader-dot:nth-child(2) { animation-delay: -0.16s; }

      @keyframes preloader-ping {
        75%, 100% { transform: scale(2.5); opacity: 0; }
      }
      @keyframes preloader-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .5; }
      }
      @keyframes preloader-bounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1.0); }
      }
      .preloader-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <div class="preloader-content">
        <div class="preloader-logo-container">
          <div class="preloader-ring"></div>
          <img src="/images/Isolation_Mode.svg" alt="Agrarian Logo" class="preloader-logo">
        </div>
        <div class="preloader-text">
          <div class="preloader-status">
            <span>Getting things ready</span>
            <div class="preloader-dots">
              <div class="preloader-dot"></div>
              <div class="preloader-dot"></div>
              <div class="preloader-dot"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('load', function() {
        var preloader = document.getElementById('preloader');
        setTimeout(function() {
          preloader.classList.add('preloader-hidden');
          setTimeout(function() {
            preloader.style.display = 'none';
          }, 500);
        }, 800);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
